services:
  postgres:
    image: postgres:17-alpine
    container_name: tp5-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: conferences
      POSTGRES_USER: psql
      POSTGRES_PASSWORD: psql
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U psql -d conferences"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
