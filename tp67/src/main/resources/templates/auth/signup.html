<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" th:attr="data-theme=${currentTheme}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inscription</title>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css">
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="min-h-screen bg-base-200">
  <main class="mx-auto flex min-h-screen max-w-md items-center px-4 py-8">
    <section class="card w-full bg-base-100 shadow">
      <div class="card-body">
        <h1 class="card-title text-3xl">Inscription</h1>
        <p class="text-base-content/70">Cree un compte pour sauvegarder tes films en base de donnees.</p>

        <div th:if="${feedbackMessage != null}"
             class="alert"
             th:classappend="${feedbackType == 'error'} ? ' alert-error' : ' alert-info'">
          <span th:text="${feedbackMessage}">Message</span>
        </div>

        <form action="/auth/signup" method="post" class="space-y-4">
          <input type="hidden" name="redirect" th:value="${param.redirect != null ? param.redirect[0] : '/films/list?page=1'}">
          <label class="form-control">
            <span class="label-text">Nom affiché</span>
            <input class="input input-bordered" type="text" name="displayName" th:value="${displayName}">
          </label>
          <label class="form-control">
            <span class="label-text">Email</span>
            <input class="input input-bordered" type="email" name="email" th:value="${email}">
          </label>
          <label class="form-control">
            <span class="label-text">Mot de passe</span>
            <input class="input input-bordered" type="password" name="password">
          </label>
          <button type="submit" class="btn btn-primary w-full">Creer mon compte</button>
        </form>

        <div class="text-sm">
          Deja inscrit ? <a class="link link-primary" th:href="@{/auth/login(redirect=${param.redirect != null ? param.redirect[0] : '/films/list?page=1'})}">Connexion</a>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
