<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${film.title}">Film</title>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
    @theme {
      --color-reel-charcoal: #0f1115;
      --color-reel-blue: #1f3255;
      --color-reel-sand: #f5ead7;
      --color-reel-red: #ca4b44;
      --color-reel-gold: #e3af4d;
    }
  </style>
</head>
<body class="min-h-screen bg-[linear-gradient(180deg,_#101116,_#182033_45%,_#f7efe0_45%,_#f7efe0_100%)] text-white">
  <div class="relative">
    <div class="absolute inset-x-0 top-0 h-[32rem] overflow-hidden">
      <img th:if="${film.backdropUrl() != null}"
           th:src="${film.backdropUrl()}"
           th:alt="${film.title}"
           class="h-full w-full object-cover opacity-30">
      <div class="absolute inset-0 bg-[linear-gradient(180deg,_rgba(15,17,21,0.2),_rgba(15,17,21,0.95))]"></div>
    </div>

    <div class="relative mx-auto max-w-6xl px-4 py-8 sm:px-6 lg:px-8">
      <div class="mb-8 flex flex-wrap items-center gap-3">
        <a href="/films/list?page=1" class="btn btn-ghost border border-white/10 bg-white/5 text-white hover:bg-white/10">Retour a la liste</a>
        <div class="badge border-0 bg-white/10 px-4 py-3 text-white/80">Favoris <span class="ml-2 font-semibold" th:text="${favoriteCount}">0</span></div>
        <div class="badge border-0 bg-white/10 px-4 py-3 text-white/80">A voir <span class="ml-2 font-semibold" th:text="${watchlistCount}">0</span></div>
      </div>

      <div th:if="${feedbackMessage != null}"
           class="alert mb-6 border-0 shadow-lg"
           th:classappend="${feedbackType == 'success'} ? ' alert-success' : ' alert-info'">
        <span th:text="${feedbackMessage}">Film ajoute.</span>
      </div>

      <section class="grid gap-8 lg:grid-cols-[320px,1fr] lg:items-start">
        <div class="overflow-hidden rounded-[2rem] border border-white/10 bg-white/5 shadow-2xl backdrop-blur">
          <img th:if="${film.posterUrl() != null}"
               th:src="${film.posterUrl()}"
               th:alt="${film.title}"
               class="h-full w-full object-cover">
          <div th:if="${film.posterUrl() == null}"
               class="flex aspect-[2/3] items-center justify-center bg-[linear-gradient(135deg,_#1f3255,_#ca4b44)] p-8 text-center">
            <span class="text-sm uppercase tracking-[0.3em] text-white/80">Aucune affiche</span>
          </div>
        </div>

        <div class="space-y-6">
          <div class="space-y-4">
            <div class="flex flex-wrap gap-3">
              <div class="badge border-0 bg-reel-gold px-4 py-3 text-reel-charcoal">Sortie <span class="ml-2 font-semibold" th:text="${film.releaseDate}">2024-01-01</span></div>
              <div class="badge border-0 bg-white/10 px-4 py-3 text-white">Note <span class="ml-2 font-semibold" th:text="${film.voteAverage}">7.8</span></div>
              <div class="badge border-0 bg-white/10 px-4 py-3 text-white">Votes <span class="ml-2 font-semibold" th:text="${film.voteCount}">100</span></div>
            </div>
            <div>
              <p class="text-sm uppercase tracking-[0.3em] text-white/50">Fiche film</p>
              <h1 class="mt-3 max-w-4xl font-serif text-4xl leading-tight sm:text-5xl" th:text="${film.title}">Titre</h1>
              <p class="mt-3 text-base text-white/60" th:text="${film.originalTitle}">Titre original</p>
            </div>
            <p class="max-w-3xl text-lg leading-8 text-white/80" th:text="${film.overview}">Synopsis</p>
          </div>

          <div class="grid gap-4 rounded-[2rem] border border-white/10 bg-white/6 p-5 backdrop-blur sm:grid-cols-3">
            <div>
              <p class="text-xs uppercase tracking-[0.25em] text-white/45">Langue</p>
              <p class="mt-2 text-2xl font-semibold uppercase" th:text="${film.originalLanguage}">FR</p>
            </div>
            <div>
              <p class="text-xs uppercase tracking-[0.25em] text-white/45">Popularite</p>
              <p class="mt-2 text-2xl font-semibold" th:text="${film.popularity}">99.9</p>
            </div>
            <div>
              <p class="text-xs uppercase tracking-[0.25em] text-white/45">Identifiant</p>
              <p class="mt-2 text-2xl font-semibold" th:text="${film.id}">0</p>
            </div>
          </div>

          <div class="flex flex-col gap-3 sm:flex-row">
            <form th:action="@{/films/{id}/favorites(id=${film.id})}" method="post">
              <button type="submit"
                      class="btn h-14 min-w-60 border-0 text-base"
                      th:classappend="${isFavorite} ? ' bg-reel-gold text-reel-charcoal hover:bg-reel-gold/90' : ' bg-white text-reel-charcoal hover:bg-reel-sand'">
                <span th:text="${isFavorite} ? 'Deja dans les favoris' : 'Ajouter ce film aux favoris'">Ajouter ce film aux favoris</span>
              </button>
            </form>
            <form th:action="@{/films/{id}/watchlist(id=${film.id})}" method="post">
              <button type="submit"
                      class="btn h-14 min-w-60 border border-white/15 bg-reel-red text-white text-base hover:bg-reel-red/90"
                      th:classappend="${isInWatchlist} ? ' opacity-80' : ''">
                <span th:text="${isInWatchlist} ? 'Deja dans la liste a voir' : 'Ajouter ce film a la liste a voir'">Ajouter ce film a la liste a voir</span>
              </button>
            </form>
          </div>
        </div>
      </section>
    </div>
  </div>
</body>
</html>
