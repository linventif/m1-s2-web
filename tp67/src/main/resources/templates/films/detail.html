<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" th:attr="data-theme=${currentTheme}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${film.title}">Film</title>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css">
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="min-h-screen bg-base-200">
  <div class="navbar bg-base-100 border-b">
    <div class="mx-auto flex w-full max-w-5xl items-center px-4">
      <div class="flex-1">
        <a href="/films/list?page=1" class="btn btn-ghost">Retour a la liste</a>
      </div>
      <div class="flex items-center gap-2">
        <form action="/theme" method="post" class="form-control">
          <input type="hidden" name="redirect" th:value="${currentUrl}">
          <select class="select select-bordered select-sm" name="theme" onchange="this.form.submit()">
            <option th:each="theme : ${themes}"
                    th:value="${theme}"
                    th:text="${theme}"
                    th:selected="${theme == currentTheme}">
              corporate
            </option>
          </select>
        </form>
        <div class="badge badge-primary gap-2">Favoris <span th:text="${favoriteCount}">0</span></div>
        <div class="badge badge-secondary gap-2">A voir <span th:text="${watchlistCount}">0</span></div>
      </div>
    </div>
  </div>

  <main class="mx-auto flex max-w-5xl flex-col gap-6 px-4 py-6">
    <div th:if="${feedbackMessage != null}"
         class="alert"
         th:classappend="${feedbackType == 'success'} ? ' alert-success' : ' alert-info'">
      <span th:text="${feedbackMessage}">Film ajoute.</span>
    </div>

    <section class="card bg-base-100 shadow">
      <div class="card-body gap-6 lg:flex-row">
        <div class="w-full max-w-xs">
          <div class="hover-3d">
            <figure class="aspect-[2/3] overflow-hidden rounded-box bg-base-300 shadow-sm">
              <img th:if="${film.posterUrl() != null}"
                   th:src="${film.posterUrl()}"
                   th:alt="${film.title}"
                   class="h-full w-full object-cover">
              <div th:if="${film.posterUrl() == null}" class="flex h-full w-full items-center justify-center p-6 text-center text-base-content/60">
                Aucune affiche
              </div>
            </figure>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
          </div>
        </div>

        <div class="w-full space-y-6">
          <div>
            <div class="flex flex-wrap gap-2">
              <div class="badge badge-outline" th:text="${film.releaseDate}">2024-01-01</div>
              <div class="badge badge-primary badge-outline">Note <span class="ml-1 font-semibold" th:text="${film.voteAverage}">7.8</span></div>
              <div class="badge badge-secondary badge-outline">Votes <span class="ml-1 font-semibold" th:text="${film.voteCount}">100</span></div>
            </div>
            <h1 class="mt-4 text-3xl font-bold" th:text="${film.title}">Titre</h1>
            <p class="mt-2 text-base-content/70" th:text="${film.originalTitle}">Titre original</p>
          </div>

          <div class="card bg-base-200">
            <div class="card-body">
              <h2 class="card-title text-lg">Resume</h2>
              <p th:text="${film.overview}">Synopsis</p>
            </div>
          </div>

          <div class="stats stats-vertical w-full shadow lg:stats-horizontal">
            <div class="stat">
              <div class="stat-title">Langue</div>
              <div class="stat-value text-primary uppercase" th:text="${film.originalLanguage}">FR</div>
            </div>
            <div class="stat">
              <div class="stat-title">Popularite</div>
              <div class="stat-value text-secondary" th:text="${film.popularity}">99.9</div>
            </div>
            <div class="stat">
              <div class="stat-title">Identifiant</div>
              <div class="stat-value" th:text="${film.id}">0</div>
            </div>
          </div>

          <div class="flex flex-col gap-3 sm:flex-row">
            <form th:action="@{/films/{id}/favorites(id=${film.id})}" method="post">
              <button type="submit"
                      class="btn btn-primary w-full sm:w-auto"
                      th:classappend="${isFavorite} ? ' btn-disabled' : ''">
                <span th:text="${isFavorite} ? 'Deja dans les favoris' : 'Ajouter ce film aux favoris'">Ajouter ce film aux favoris</span>
              </button>
            </form>
            <form th:action="@{/films/{id}/watchlist(id=${film.id})}" method="post">
              <button type="submit"
                      class="btn btn-secondary w-full sm:w-auto"
                      th:classappend="${isInWatchlist} ? ' btn-disabled' : ''">
                <span th:text="${isInWatchlist} ? 'Deja dans la liste a voir' : 'Ajouter ce film a la liste a voir'">Ajouter ce film a la liste a voir</span>
              </button>
            </form>
          </div>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
