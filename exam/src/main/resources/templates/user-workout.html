<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Liste des Activité</title>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="min-h-screen bg-base-200 text-base-content">
  <main class="mx-auto flex min-h-screen w-full max-w-6xl flex-col px-4 py-6 sm:px-6 lg:px-8">
    <section class="card border border-base-300 bg-base-100 shadow-xl">
      <div class="card-body gap-6 p-6 sm:p-8">
        <div class="flex flex-wrap gap-3">
          <a class="btn btn-outline" th:href="@{/users/profile}">Profil</a>
          <a class="btn btn-outline" th:href="@{/users/friends}">Amis</a>
          <a class="btn btn-outline" th:href="@{/users/users}">Utilisateurs</a>
          <a class="btn btn-outline" th:href="@{/users/workout}">Activités</a>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
