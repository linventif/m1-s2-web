<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mettre a jour une conference</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="min-h-screen bg-base-200 text-base-content">
    <main class="mx-auto flex min-h-screen w-full max-w-5xl flex-col px-4 py-6 sm:px-6 lg:px-8">
        <section class="hero mb-6 overflow-hidden rounded-box bg-gradient-to-r from-warning to-primary text-slate-950 shadow-xl">
            <div class="hero-content w-full justify-start px-6 py-8 sm:px-10">
                <div class="max-w-3xl">
                    <p class="mb-3 text-xs font-semibold uppercase tracking-[0.3em] text-slate-950">Update</p>
                    <h1 class="text-3xl font-black text-slate-950 sm:text-4xl">Mettre a jour une conference</h1>
                    <p class="mt-3 text-sm text-slate-950 sm:text-base">Indiquez l'identifiant de la conference a modifier, puis ses nouvelles valeurs.</p>
                </div>
            </div>
        </section>

        <section class="card border border-base-300 bg-base-100 shadow-xl">
            <div class="card-body p-6 sm:p-8">
                <form class="grid gap-5" th:action="@{/conferences/update}" th:object="${conference}" method="post">
                    <label class="form-control w-full" for="idconf">
                        <div class="label">
                            <span class="label-text text-sm font-semibold">Identifiant</span>
                        </div>
                        <input id="idconf" class="input input-bordered w-full" name="idconf" type="number" min="1" required>
                    </label>

                    <label class="form-control w-full" for="titleconf">
                        <div class="label">
                            <span class="label-text text-sm font-semibold">Titre</span>
                        </div>
                        <input id="titleconf" class="input input-bordered w-full" type="text" th:field="*{titleconf}" required>
                    </label>

                    <label class="form-control w-full" for="nbeditionconf">
                        <div class="label">
                            <span class="label-text text-sm font-semibold">Numero d'edition</span>
                        </div>
                        <input id="nbeditionconf" class="input input-bordered w-full" type="number" min="1" th:field="*{nbeditionconf}" required>
                    </label>

                    <label class="form-control w-full" for="dtstartconf">
                        <div class="label">
                            <span class="label-text text-sm font-semibold">Date de debut</span>
                        </div>
                        <input id="dtstartconf" class="input input-bordered w-full" type="date" th:field="*{dtstartconf}" required>
                    </label>

                    <label class="form-control w-full" for="dtendconf">
                        <div class="label">
                            <span class="label-text text-sm font-semibold">Date de fin</span>
                        </div>
                        <input id="dtendconf" class="input input-bordered w-full" type="date" th:field="*{dtendconf}" required>
                    </label>

                    <label class="form-control w-full" for="urlwebsiteconf">
                        <div class="label">
                            <span class="label-text text-sm font-semibold">Site web</span>
                        </div>
                        <input id="urlwebsiteconf" class="input input-bordered w-full" type="url" th:field="*{urlwebsiteconf}" placeholder="https://example.org">
                    </label>

                    <div class="space-y-4">
                        <div>
                            <h2 class="text-2xl font-bold text-slate-950">Thematiques</h2>
                            <p class="mt-1 text-sm text-base-content/70">Selectionnez les thematiques a associer a la conference apres mise a jour.</p>
                        </div>
                        <div class="alert alert-info" th:if="${#lists.isEmpty(thematiques)}">
                            <span>Aucune thematique disponible pour le moment.</span>
                        </div>
                        <div class="grid gap-3 md:grid-cols-2" th:if="${!#lists.isEmpty(thematiques)}">
                            <label class="flex items-start gap-4 rounded-box border border-base-300 bg-base-200/60 p-4 transition hover:border-warning/50 hover:bg-base-200"
                                   th:each="thematique : ${thematiques}">
                                <input class="checkbox checkbox-warning mt-1" type="checkbox" name="thematiqueIds" th:value="${thematique.idThematique}">
                                <span class="space-y-1">
                                    <strong class="block text-base text-slate-950" th:text="${thematique.nomThematique}">Thematique</strong>
                                </span>
                            </label>
                        </div>
                    </div>

                    <div class="mt-2 flex flex-wrap gap-3">
                        <button class="btn btn-warning" type="submit">Mettre a jour</button>
                        <a class="btn btn-outline" th:href="@{/conferences}">Retour au menu</a>
                    </div>
                </form>
            </div>
        </section>
    </main>
</body>
</html>
