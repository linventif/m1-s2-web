<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion utilisateur</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="min-h-screen bg-base-200 text-base-content">
    <main class="mx-auto flex min-h-screen w-full max-w-5xl flex-col px-4 py-6 sm:px-6 lg:px-8">
        <section class="hero mb-6 overflow-hidden rounded-box bg-gradient-to-r from-success to-primary text-slate-950 shadow-xl">
            <div class="hero-content w-full justify-start px-6 py-8 sm:px-10">
                <div class="max-w-3xl">
                    <p class="mb-3 text-xs font-semibold uppercase tracking-[0.3em] text-slate-950">Login</p>
                    <h1 class="text-3xl font-black text-slate-950 sm:text-4xl">Connexion utilisateur</h1>
                    <p class="mt-3 text-sm text-slate-950 sm:text-base">Connectez-vous avec votre email et votre mot de passe pour acceder a votre espace personnel.</p>
                </div>
            </div>
        </section>

        <section class="card border border-base-300 bg-base-100 shadow-xl">
            <div class="card-body p-6 sm:p-8">
                <div class="alert alert-info" th:if="${message != null}">
                    <span th:text="${message}">Message</span>
                </div>

                <div class="alert alert-error" th:if="${errorMessage != null}">
                    <span th:text="${errorMessage}">Erreur</span>
                </div>

                <form class="grid gap-5" th:action="@{/users/login}" method="post">
                    <label class="form-control w-full" for="email">
                        <div class="label">
                            <span class="label-text text-sm font-semibold">Email</span>
                        </div>
                        <input id="email" class="input input-bordered w-full" name="email" type="email" required>
                    </label>

                    <label class="form-control w-full" for="password">
                        <div class="label">
                            <span class="label-text text-sm font-semibold">Mot de passe</span>
                        </div>
                        <input id="password" class="input input-bordered w-full" name="password" type="password" required>
                    </label>

                    <div class="mt-2 flex flex-wrap gap-3">
                        <button class="btn btn-primary" type="submit">Se connecter</button>
                        <a class="btn btn-outline" th:href="@{/users}">Retour au menu</a>
                        <a class="btn btn-ghost" th:href="@{/users/create}">Creer un compte</a>
                    </div>
                </form>
            </div>
        </section>
    </main>
</body>
</html>
